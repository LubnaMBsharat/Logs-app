services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: log_app
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      DATABASE_URL: postgres://postgres:postgres@db:5432/log_db
      NODE_ENV: production
    cpus: 0.5
    mem_limit: 256m
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: log_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: log_db
    ports:
      - "5432:5432"
    cpus: 1.0
    mem_limit: 1000m
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d log_db"]
      interval: 3s
      timeout: 3s
      retries: 5

volumes:
  postgres_data: